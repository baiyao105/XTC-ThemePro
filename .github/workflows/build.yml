name: Publish

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号 (例如: v3.0.1.3)"
        required: false
        type: string

env:
  MODULE_NAME: XTC-ThemePro

jobs:
  build-and-release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read

    steps:
      - name: checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.version }}" ]; then
              echo "[DEBUG] 必须指定版本号"
              exit 1
            fi
            VERSION="${{ github.event.inputs.version }}"
            if [[ ! $VERSION =~ ^v ]]; then
              VERSION="v$VERSION"
            fi
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_without_v=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "[DEBUG] Release version: $VERSION"

      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "[DEBUG] Creating tag: $VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION" --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Generate changelog
        run: |
          git-cliff --config .github/cliff.toml --latest --strip header > changelog.md

      - name: Update version info
        run: |
          VERSION="${{ steps.version.outputs.version_without_v }}"
          echo "[DEBUG] 更新版本到: $VERSION"
          VERSION_CODE=$(echo $VERSION | sed 's/\.//g' | sed 's/^/3/')
          sed -i "s/^version=.*/version=$VERSION/" module.prop
          sed -i "s/^versionCode=.*/versionCode=$VERSION_CODE/" module.prop
          REPO_URL="https://gh-proxy.com/github.com/${{ github.repository }}"
          cat > update.json << EOF
          {
              "version": "$VERSION",
              "versionCode": $VERSION_CODE,
              "zipUrl": "$REPO_URL/releases/download/${{ steps.version.outputs.version }}/${MODULE_NAME}_$VERSION.zip",
              "changelog": "$REPO_URL/releases/download/${{ steps.version.outputs.version }}/changelog.md"
          }
          EOF

      - name: Commit version updates
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: |
            Publish: version ${{ steps.version.outputs.version }}

            Co-authored-by: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          commit_options: "--signoff"
          commit_user_name: "ChimeYao-bot"
          commit_user_email: "ChimeYao@outlook.jp"
          commit_author: "ChimeYao-bot <ChimeYao@outlook.jp>"
          file_pattern: "module.prop update.json"

      - name: Build Magisk module
        run: |
          VERSION="${{ steps.version.outputs.version_without_v }}"
          ZIP_NAME="${MODULE_NAME}_$VERSION.zip"
          mkdir -p temp_module
          rsync -av --exclude='.git*' \
                    --exclude='temp_module' \
                    --exclude='docs' \
                    --exclude='.github/*' \
                    --exclude='changelog.md' \
                    --exclude='CHANGELOG.md' \
                    . temp_module/
          cd temp_module
          zip -9 -r "../$ZIP_NAME" . -x "*.git*" "docs/*" "*.md"
          cd ..
          rm -rf temp_module

          echo "[DEBUG] Module creation completed: $ZIP_NAME"

      - name: Calculate checksums
        id: checksums
        run: |
          VERSION="${{ steps.version.outputs.version_without_v }}"
          ZIP_NAME="${MODULE_NAME}_$VERSION.zip"
          MD5_SUM=$(md5sum "$ZIP_NAME" | cut -d' ' -f1)
          SHA256_SUM=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)
          FILE_SIZE=$(stat -c%s "$ZIP_NAME")
          echo "md5=$MD5_SUM" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256_SUM" >> $GITHUB_OUTPUT
          echo "size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "[DEBUG] File: $ZIP_NAME ($FILE_SIZE bytes)"

      - name: Prepare release summary
        run: |
          VERSION="${{ steps.version.outputs.version_without_v }}"
          echo "" >> changelog.md
          echo "**文件**: \`${MODULE_NAME}_${VERSION}.zip\` (${{ steps.checksums.outputs.size }} 字节)" >> changelog.md
          echo "**MD5**: \`${{ steps.checksums.outputs.md5 }}\`" >> changelog.md
          echo "**SHA256**: \`${{ steps.checksums.outputs.sha256 }}\`" >> changelog.md
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🎉 ${MODULE_NAME} 新版本 v${VERSION}
          **文件**: \`${MODULE_NAME}_${VERSION}.zip\` (${{ steps.checksums.outputs.size }} 字节)
          **MD5**: \`${{ steps.checksums.outputs.md5 }}\`
          **SHA256**: \`${{ steps.checksums.outputs.sha256 }}\`
          EOF

          echo "[DEBUG] Release summary preparation completed"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "🎨 ${{ env.MODULE_NAME }} ${{ steps.version.outputs.version }}"
          body_path: changelog.md
          draft: true
          prerelease: false
          files: |
            ${{ env.MODULE_NAME }}_${{ steps.version.outputs.version_without_v }}.zip
            changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
