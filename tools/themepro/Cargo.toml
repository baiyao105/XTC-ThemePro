[package]
name = "themepro"
version = "0.1.0"
edition = "2021"
description = "XTC-ThemePro tools"
authors = ["baiyao105"]
license = "AGPL-3.0-only"

[[bin]]
name = "themepro"
path = "src/bin/cli/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.11"
hex = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[profile.dev]
# debug = true
